<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5ff4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c5ff4a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" fill="#000000"/>

  <!-- Grid lines -->
  <g stroke="#1a1a1a" stroke-width="0.5">
    <line x1="0" y1="20" x2="400" y2="20"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="20" y1="0" x2="20" y2="120"/>
    <line x1="40" y1="0" x2="40" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="120"/>
  </g>

  <!-- Eye shape (left icon) -->
  <g transform="translate(20, 10)" filter="url(#glow)">
    <!-- Outer eye -->
    <path d="M10 50 Q50 10 90 50 Q50 90 10 50Z" fill="none" stroke="#c5ff4a" stroke-width="1.5"/>
    <!-- Iris -->
    <circle cx="50" cy="50" r="18" fill="none" stroke="#c5ff4a" stroke-width="1.5"/>
    <!-- Pupil -->
    <circle cx="50" cy="50" r="7" fill="#c5ff4a"/>
    <!-- Scan line through eye -->
    <line x1="10" y1="50" x2="90" y2="50" stroke="#c5ff4a" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
    <!-- Circuit nodes -->
    <circle cx="10" cy="50" r="2.5" fill="#c5ff4a"/>
    <circle cx="90" cy="50" r="2.5" fill="#c5ff4a"/>
    <!-- Corner brackets -->
    <path d="M2 35 L2 28 L9 28" fill="none" stroke="#597321" stroke-width="1"/>
    <path d="M98 35 L98 28 L91 28" fill="none" stroke="#597321" stroke-width="1"/>
    <path d="M2 65 L2 72 L9 72" fill="none" stroke="#597321" stroke-width="1"/>
    <path d="M98 65 L98 72 L91 72" fill="none" stroke="#597321" stroke-width="1"/>
    <!-- Glow -->
    <circle cx="50" cy="50" r="30" fill="url(#eyeGlow)"/>
    <!-- Radial tick marks -->
    <g stroke="#597321" stroke-width="0.8">
      <line x1="50" y1="28" x2="50" y2="23"/>
      <line x1="50" y1="72" x2="50" y2="77"/>
      <line x1="28" y1="50" x2="23" y2="50"/>
      <line x1="72" y1="50" x2="77" y2="50"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(135, 0)">
    <text x="0" y="58" font-family="'Courier New', monospace" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-1">DEEP</text>
    <text x="92" y="58" font-family="'Courier New', monospace" font-size="38" font-weight="700" fill="#c5ff4a" letter-spacing="-1">PROOF</text>
    <!-- Tagline -->
    <text x="1" y="78" font-family="'Courier New', monospace" font-size="10" fill="#3d3d3d" letter-spacing="3">NEXUS</text>
    <text x="60" y="78" font-family="'Courier New', monospace" font-size="10" fill="#3d3d3d" letter-spacing="1"> · VERIFIABLE DETECTION · 0G</text>
  </g>

  <!-- Right side: chain/block motif -->
  <g transform="translate(355, 28)" stroke="#252525" stroke-width="1" fill="none">
    <rect x="0" y="0" width="22" height="22" stroke="#597321"/>
    <rect x="5" y="5" width="12" height="12" stroke="#c5ff4a" stroke-width="0.8"/>
    <circle cx="11" cy="11" r="3" fill="#c5ff4a" stroke="none"/>
    <line x1="11" y1="22" x2="11" y2="32"/>
    <rect x="0" y="32" width="22" height="22" stroke="#597321"/>
    <rect x="5" y="37" width="12" height="12" stroke="#252525" stroke-width="0.8"/>
    <circle cx="11" cy="43" r="3" fill="#252525" stroke="#597321" stroke-width="1"/>
  </g>

  <!-- Bottom border accent -->
  <line x1="0" y1="118" x2="400" y2="118" stroke="#c5ff4a" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="119" x2="120" y2="119" stroke="#c5ff4a" stroke-width="1" opacity="0.8"/>
</svg>
